<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
</head>
<body>

    <h2>Change Your Password</h2>

    <p>You must change your temporary password before continuing.</p>

    <form id="changePasswordForm">

        <input
            type="password"
            id="currentPassword"
            placeholder="Current password"
            required
        >

        <br><br>

        <input
            type="password"
            id="newPassword"
            placeholder="New password"
            required
        >

        <br><br>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            required
        >

        <br><br>

        <button type="submit">
            Change Password
        </button>

    </form>

    <p id="message"></p>

    <script src="/admin/js/change-password.js"></script>

</body>
</html>
