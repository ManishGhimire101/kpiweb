<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Super Admin Dashboard</title>

  <link
    rel="stylesheet"
    href="/super_admin/css/dashboard.css"
  />
  <link
  rel="stylesheet"
  href="/super_admin/css/institution.css"
/>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR COMPONENT -->
    <div id="sidebar"></div>

    <!-- MAIN -->
    <main class="main">

      <!-- NAVBAR COMPONENT -->
      <div id="navbar"></div>

      <!-- CONTENT -->
      <section class="content">

        <div id="pageContent">

          <!-- Dashboard content -->

          <div class="welcome">
            <h2>Welcome back, Super Admin</h2>

            <p>
              Manage institutions, users, content and
              system settings from one place.
            </p>
          </div>

          <div class="stats-grid">

            <div class="stat-card">
              <div class="stat-icon">🏫</div>

              <div>
                <span>Total Institutions</span>
                <strong id="totalInstitutions">0</strong>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">👥</div>

              <div>
                <span>Total Users</span>
                <strong id="totalUsers">0</strong>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">🎓</div>

              <div>
                <span>Students</span>
                <strong id="totalStudents">0</strong>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">👨‍🏫</div>

              <div>
                <span>Teachers</span>
                <strong id="totalTeachers">0</strong>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon">👨‍👩‍👧</div>

              <div>
                <span>Parents</span>
                <strong id="totalParents">0</strong>
              </div>
            </div>

          </div>

          <div class="dashboard-section">

            <div class="section-header">
              <div>
                <h2>Recent Activity</h2>
                <p>Latest system activity</p>
              </div>
            </div>

            <div
              id="activityList"
              class="activity-list"
            >
              <div class="empty-state">
                No recent activity
              </div>
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

<script src="/super_admin/js/auth.js"></script>
<script src="/super_admin/js/dashboard.js"></script>
<script src="/super_admin/js/institutions.js"></script>
<script src="/super_admin/js/users.js"></script>
<script src="/super_admin/js/app.js"></script>

</body>
</html>
