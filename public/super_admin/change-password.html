<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Super Admin - Change password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
    .wrap { width: 100%; max-width: 440px; padding: 20px; }
    .card { background: #fff; padding: 35px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08); }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .subtitle { color: #666; margin-bottom: 22px; font-size: 15px; }
    .notice { background: #fff4d6; color: #8a5a00; padding: 12px; border-radius: 6px; margin-bottom: 18px; font-size: 14px; line-height: 1.45; }
    .message { display: none; margin-bottom: 18px; padding: 12px; border-radius: 6px; font-size: 14px; }
    .message.error { display: block; background: #ffe5e5; color: #b00000; }
    .message.success { display: block; background: #e5f7e9; color: #176b2c; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
    .input { position: relative; }
    input { width: 100%; padding: 12px 64px 12px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #333; }
    .toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: auto; padding: 6px 8px; background: transparent; color: #666; font-size: 13px; font-weight: bold; border: 0; border-radius: 4px; cursor: pointer; }
    .toggle:hover { background: #f0f0f0; color: #222; }
    .rules { list-style: none; margin-top: 10px; display: grid; gap: 5px; font-size: 13px; color: #777; }
    .rules li { display: flex; align-items: center; gap: 8px; }
    .rules li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex: none; }
    .rules li.ok { color: #176b2c; }
    .rules li.ok::before { background: #2f9e5a; }
    .submit { width: 100%; padding: 13px; border: none; border-radius: 6px; background: #222; color: #fff; font-size: 16px; cursor: pointer; }
    .submit:hover { background: #000; }
    .submit:disabled { background: #999; cursor: not-allowed; }
    .links { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 14px; }
    .links a { color: #222; }
    .link-btn { margin-left: auto; background: none; border: 0; color: #666; font-size: 14px; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Change password</h1>
      <p class="subtitle" id="subtitle">Super Admin account</p>

      <div class="notice" id="forcedNotice" hidden>
        This account is still using its initial password. Set a strong password of your own before using the panel.
      </div>

      <div class="message" id="message" role="alert"></div>

      <form id="form" novalidate hidden>
        <div class="form-group">
          <label for="currentPassword">Current password</label>
          <div class="input">
            <input type="password" id="currentPassword" autocomplete="current-password" required>
            <button type="button" class="toggle" data-toggle="currentPassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <div class="form-group">
          <label for="newPassword">New password</label>
          <div class="input">
            <input type="password" id="newPassword" autocomplete="new-password" minlength="12" maxlength="128" required aria-describedby="rules">
            <button type="button" class="toggle" data-toggle="newPassword" aria-label="Show password">Show</button>
          </div>
          <ul class="rules" id="rules">
            <li data-rule="length">At least 12 characters</li>
            <li data-rule="mix">Letters and numbers</li>
            <li data-rule="username">Does not contain the username</li>
            <li data-rule="different">Different from the current password</li>
          </ul>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <div class="input">
            <input type="password" id="confirmPassword" autocomplete="new-password" required>
            <button type="button" class="toggle" data-toggle="confirmPassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="submit" id="submit">Update password</button>
      </form>

      <div class="links">
        <a href="/super_admin" id="back" hidden>&larr; Back to dashboard</a>
        <button type="button" class="link-btn" id="signOut">Sign out</button>
      </div>
    </div>
  </div>
  <script src="/super_admin/js/change-password.js"></script>
</body>
</html>
