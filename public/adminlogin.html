<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;
            border-radius: 12px;

            padding: 40px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 2px solid #e0e0e0;
            border-radius: 6px;

            font-size: 14px;

            transition: 0.2s;
        }

        input:focus {
            outline: none;

            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;

            display: none;
        }

        .error-message {
            color: #c0392b;
            background: #fadbd8;

            border-left: 4px solid #e74c3c;
        }

        .success-message {
            color: #218c54;
            background: #d5f4e6;

            border-left: 4px solid #27ae60;
        }

        .loading {
            display: inline-block;

            width: 14px;
            height: 14px;

            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin-right: 8px;

            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">

        <div class="icon">🔐</div>

        <h1>Admin Login</h1>

        <p>your institution Management System</p>

    </div>


    <div
        id="errorMessage"
        class="message error-message">
    </div>

    <div
        id="successMessage"
        class="message success-message">
    </div>


    <form id="loginForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            id="loginBtn"
            class="login-btn">

            Login

        </button>

    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a href="/forgot-password" style="color: #667eea; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s;">
            Forgot Password?
        </a>
    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


function showError(message) {

    errorMessage.textContent = "❌ " + message;

    errorMessage.style.display = "block";

    successMessage.style.display = "none";
}


function showSuccess(message) {

    successMessage.textContent = "✅ " + message;

    successMessage.style.display = "block";

    errorMessage.style.display = "none";
}


loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    errorMessage.style.display = "none";
    successMessage.style.display = "none";


    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;


    if (!username) {

        showError("Please enter your username");

        usernameInput.focus();

        return;
    }


    if (!password) {

        showError("Please enter your password");

        passwordInput.focus();

        return;
    }


    loginBtn.disabled = true;

    const originalText =
        loginBtn.innerHTML;

    loginBtn.innerHTML =
        '<span class="loading"></span>Logging in...';


    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Invalid username or password"
            );
        }


        /*
         * Store JWT
         */
        if (data.token) {

            localStorage.setItem(
                "adminToken",
                data.token
            );
        }


        /*
         * Store logged-in user
         */
        if (data.user) {

            localStorage.setItem(
                "adminUser",
                JSON.stringify(data.user)
            );
        }


        showSuccess(
            data.message ||
            "Login successful"
        );


        /*
         * If password must be changed,
         * redirect to password-change page.
         */
        if (
            data.user &&
            data.user.mustChangePassword
        ) {

            setTimeout(() => {

                window.location.href =
                    "/admin/change-password";

            }, 800);

            return;
        }


        /*
         * Normal Admin dashboard
         */
        setTimeout(() => {

            window.location.href =
                "/admin";

        }, 800);


    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );

        showError(
            error.message ||
            "Connection error. Please try again."
        );

    } finally {

        loginBtn.disabled = false;

        loginBtn.innerHTML =
            originalText;
    }

});


window.addEventListener(
    "load",
    () => {
        usernameInput.focus();
    }
);

</script>

</body>
</html>
