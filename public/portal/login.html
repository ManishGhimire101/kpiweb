<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/portal/portal.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1 id="instName">Sign in</h1>
        <p class="sub" id="instSub">Student, parent, teacher and admin portal</p>
        <p class="small" style="margin-bottom: 14px"><a href="/" style="color: var(--brand)">&larr; Back to website</a></p>
        <div class="form-error" id="error" hidden></div>
        <form id="loginForm" hidden>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" style="width: 100%" id="submitBtn" type="submit">Sign in</button>
        </form>
      </div>
    </div>
    <script src="/portal/common.js"></script>
    <script src="/portal/login.js"></script>
  </body>
</html>
