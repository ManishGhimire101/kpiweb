<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="/portal/portal.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1 id="pageTitle">Reset password</h1>
        <p class="sub">Enter your account details and choose a new password.</p>
        <p class="small" style="margin-bottom: 14px">
          <a href="/login" style="color: var(--brand)">&larr; Back to sign in</a>
        </p>
        <div class="form-error" id="error" hidden></div>
        <form id="forgotForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="email">Registered email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button class="btn" style="width: 100%" id="submitBtn" type="submit">Reset password</button>
        </form>
      </div>
    </div>
    <script src="/portal/common.js"></script>
    <script src="/portal/forgot-password.js"></script>
  </body>
</html>
