<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change password</title>
    <link rel="stylesheet" href="/portal/portal.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card pw-card">
        <p class="pw-school" id="pwSchool"></p>
        <h1 id="pwTitle">Change password</h1>
        <p class="sub" id="pwSub">Enter your current password and choose a new one.</p>

        <div class="pw-notice" id="pwForced" hidden>
          You signed in with a temporary password. Set your own password to continue.
        </div>

        <div class="form-error" id="pwError" role="alert" hidden></div>
        <div class="pw-success" id="pwSuccess" role="status" hidden></div>

        <form id="pwForm" novalidate hidden>
          <div class="field">
            <label for="currentPassword" id="currentLabel">Current password</label>
            <div class="pw-input">
              <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required />
              <button type="button" class="pw-toggle" data-toggle="currentPassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <div class="pw-input">
              <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required aria-describedby="pwRules" />
              <button type="button" class="pw-toggle" data-toggle="newPassword" aria-label="Show password">Show</button>
            </div>
            <ul class="pw-rules" id="pwRules">
              <li data-rule="length">At least 8 characters</li>
              <li data-rule="different">Different from the current password</li>
            </ul>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="pw-input">
              <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required />
              <button type="button" class="pw-toggle" data-toggle="confirmPassword" aria-label="Show password">Show</button>
            </div>
          </div>
          <button class="btn" style="width: 100%" id="pwSubmit" type="submit">Update password</button>
        </form>

        <div class="pw-links">
          <a href="/" id="pwBack" hidden>&larr; Back</a>
          <button type="button" class="pw-link-btn" id="pwSignOut">Sign out</button>
        </div>
      </div>
    </div>
    <script src="/portal/common.js"></script>
    <script src="/portal/change-password.js"></script>
  </body>
</html>
