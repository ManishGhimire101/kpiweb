<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --card: #ffffff;
        --primary: #1d4ed8;
        --primary-dark: #1e3a8a;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dbe4ff;
        --success-bg: #ecfdf3;
        --success-text: #166534;
        --error-bg: #fef2f2;
        --error-text: #991b1b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        padding: 24px 16px;
      }

      .container {
        width: min(900px, 100%);
        margin: 0 auto;
      }

      .admin-hero {
        background: linear-gradient(
          130deg,
          var(--primary-dark),
          var(--primary)
        );
        color: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(30, 58, 138, 0.25);
        margin-bottom: 18px;
      }

      .admin-hero h1 {
        font-size: clamp(1.4rem, 3vw, 2rem);
        margin-bottom: 8px;
      }

      .admin-hero p {
        opacity: 0.95;
        line-height: 1.6;
        max-width: 700px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(29, 78, 216, 0.08);
        padding: 22px;
      }

      .card h2 {
        color: var(--primary-dark);
        margin-bottom: 14px;
        font-size: 1.2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.92rem;
        font-weight: 700;
        color: #334155;
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        border: 1px solid #c9d8ff;
        border-radius: 10px;
        padding: 10px 12px;
        background: #fff;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.14);
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        border: none;
        background: linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
        color: #fff;
        font-weight: 700;
        padding: 11px 18px;
        border-radius: 10px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(30, 58, 138, 0.25);
      }

      .logout-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        padding: 10px 16px;
        font-size: 0.9rem;
        z-index: 999;
      }

      .logout-btn:hover {
        box-shadow: 0 8px 18px rgba(220, 38, 38, 0.3);
      }

      #msg,
      #passwordMsg {
        margin-top: 12px;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        display: none;
      }

      #msg.success,
      #passwordMsg.success {
        display: block;
        background: var(--success-bg);
        color: var(--success-text);
        border: 1px solid #bbf7d0;
      }

      #msg.error,
      #passwordMsg.error {
        display: block;
        background: var(--error-bg);
        color: var(--error-text);
        border: 1px solid #fecaca;
      }

      .help {
        font-size: 0.86rem;
        color: var(--muted);
        margin-top: 4px;
      }

      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }

        body {
          padding: 16px 12px;
        }

        .card,
        .admin-hero {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    <main class="container">
      <section class="admin-hero">
        <h1>Admin Upload Dashboard</h1>
        <p>
          Add banners, notices, staff images, and gallery items quickly. Fill in
          the form below and submit to publish content.
        </p>
      </section>

      <section class="card">
        <h2>Upload Content</h2>

        <form id="uploadForm">
          <div class="grid">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" required>
                <option value="home">Home</option>
                <option value="about">About</option>
                <option value="notices">Notices</option>
                <option value="staff">Staff</option>
                <option value="gallary">Gallary</option>
              </select>
            </div>

            <div class="field">
              <label for="title">Title</label>
              <input
                type="text"
                id="title"
                placeholder="Enter title (optional)"
              />
            </div>

            <div class="field full">
              <label for="details">Details</label>
              <textarea
                id="details"
                placeholder="Write short details (optional)"
              ></textarea>
            </div>

            <div class="field full">
              <label for="image">Image</label>
              <input type="file" id="image" accept="image/*" required />
              <p class="help">
                Supported: jpg, png, webp. Please upload clear images.
              </p>
            </div>
          </div>

          <div class="actions">
            <button type="submit">Upload Now</button>
          </div>
        </form>

        <p id="msg" aria-live="polite"></p>
      </section>

      <section class="card" style="margin-top: 24px;">
        <h2>🔐 Change Admin Password</h2>
        <form id="passwordForm">
          <div class="grid">
            <div class="field">
              <label for="currentPassword">Current Password</label>
              <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password"
                required
              />
            </div>
            <div class="field">
              <label for="newPassword">New Password</label>
              <input
                type="password"
                id="newPassword"
                placeholder="Enter new password (min 6 chars)"
                required
              />
            </div>
            <div class="field full">
              <label for="confirmNewPassword">Confirm New Password</label>
              <input
                type="password"
                id="confirmNewPassword"
                placeholder="Re-enter new password"
                required
              />
            </div>
          </div>
          <div class="actions">
            <button type="submit" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);">
              Update Password
            </button>
          </div>
        </form>
        <p id="passwordMsg" aria-live="polite"></p>
      </section>
    </main>

    <script>
      // Logout functionality
      const logoutBtn = document.getElementById("logoutBtn");
      
      logoutBtn.addEventListener("click", async () => {
        if (confirm("Are you sure you want to logout?")) {
          try {
            const response = await fetch("/api/logout", {
              method: "POST",
              credentials: "include",
            });

            if (response.ok) {
              // Redirect to login page
              window.location.href = "/login";
            } else {
              alert("Logout failed. Please try again.");
            }
          } catch (error) {
            console.error("Logout error:", error);
            alert("An error occurred during logout.");
          }
        }
      });

      const form = document.getElementById("uploadForm");
      const msg = document.getElementById("msg");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        msg.className = "";
        msg.textContent = "Uploading...";
        msg.classList.add("success");

        const category = document.getElementById("category").value;
        const title = document.getElementById("title").value;
        const details = document.getElementById("details").value;
        const image = document.getElementById("image").files[0];

        const data = new FormData();
        data.append("title", title);
        data.append("details", details);
        data.append("image", image);

        try {
          const res = await fetch(`/api/admin/upload/${category}`, {
            method: "POST",
            body: data,
          });

          const result = await res.json();

          if (!res.ok) {
            msg.className = "error";
            msg.textContent = result.message || "Upload failed";
            return;
          }

          msg.className = "success";
          msg.textContent = result.message || "Upload completed successfully";
          form.reset();
        } catch (error) {
          msg.className = "error";
          msg.textContent = "Network error. Please try again.";
        }
      });

      // Password change functionality
      const passwordForm = document.getElementById("passwordForm");
      const passwordMsg = document.getElementById("passwordMsg");

      passwordForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        passwordMsg.className = "";
        passwordMsg.textContent = "";
        passwordMsg.style.display = "none";

        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmNewPassword = document.getElementById("confirmNewPassword").value;

        if (newPassword.length < 6) {
          passwordMsg.className = "error";
          passwordMsg.textContent = "New password must be at least 6 characters long.";
          return;
        }

        if (newPassword !== confirmNewPassword) {
          passwordMsg.className = "error";
          passwordMsg.textContent = "New passwords do not match.";
          return;
        }

        passwordMsg.className = "success";
        passwordMsg.textContent = "Updating password...";

        try {
          const res = await fetch("/api/admin/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ currentPassword, newPassword }),
          });

          const result = await res.json();

          if (!res.ok) {
            passwordMsg.className = "error";
            passwordMsg.textContent = result.message || "Failed to update password.";
            return;
          }

          passwordMsg.className = "success";
          passwordMsg.textContent = result.message || "Password updated successfully!";
          passwordForm.reset();
        } catch (error) {
          passwordMsg.className = "error";
          passwordMsg.textContent = "Network error. Please try again.";
        }
      });
    </script>
  </body>
</html>
