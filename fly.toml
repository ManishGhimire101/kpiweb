# fly.toml - Fly.io configuration
app = "shikshya"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "node server.js"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"